syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.customerservice.grpc";
option java_outer_classname = "CustomerProto";

package customer;

service CustomerService {
  rpc GetCustomer(GetCustomerRequest) returns (Customer);
  rpc CollectCustomers(stream GetCustomerRequest) returns (CustomerBatchResponse);
}

message GetCustomerRequest {
  string id = 1;
}

message Customer {
  string id = 1;
  string name = 2;
  string email = 3;
}

message CustomerBatchResponse {
  repeated Customer customers = 1;
  int32 received = 2;
  int32 limit = 3;
}
